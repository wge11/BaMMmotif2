name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            experimental: false
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
            experimental: false
          # macOS support is not yet verified; Apple clang builds without OpenMP
          - os: macos-latest
            compiler: clang
            cxx: clang++
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libboost-dev libomp-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBAMM_WERROR=ON
        env:
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test on the example data
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff -r py/requirements.txt
      - run: ruff check py tests
      - run: ruff format --check py tests
      - run: python -m unittest discover -s tests -v
